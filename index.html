<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03060c">
<meta name="robots" content="noindex,nofollow">
<title>JARVIS · Assistente do Arão</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#03060c;--c:#35e6ff;--ok:#5dffb8;--warn:#ffc14d;--tx:#d6f4ff;--mu:#6f9db0;--gl:rgba(120,220,255,.07);--bd:rgba(120,220,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;font-size:17px;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(120% 70% at 50% 22%,#0a1a2a 0%,#03060c 62%)}
#app:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);pointer-events:none;z-index:5}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 0;z-index:3}
header h1{margin:0;font:700 14px Orbitron,sans-serif;letter-spacing:.34em;color:var(--c);text-shadow:0 0 12px rgba(53,230,255,.6)}
#dot{width:9px;height:9px;border-radius:50%;background:#35505c;box-shadow:0 0 0 0 transparent;transition:.3s}
#dot.on{background:var(--ok);animation:pd 1.8s infinite}
@keyframes pd{0%{box-shadow:0 0 0 0 rgba(93,255,184,.55)}100%{box-shadow:0 0 0 10px rgba(93,255,184,0)}}
header .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--gl);display:grid;place-items:center;cursor:pointer;transition:.2s;position:relative;flex:none}
.ib svg{width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{transform:scale(.92)}
.ib.act{background:rgba(53,230,255,.16);border-color:rgba(53,230,255,.55);box-shadow:0 0 14px rgba(53,230,255,.3)}
.ib.off svg{stroke:#58707a}.ib.off:after{content:"";position:absolute;width:24px;height:2px;background:#ff6b6b;transform:rotate(-45deg);border-radius:2px}
.stage{position:relative;flex:0 0 auto;height:min(40vh,330px);display:grid;place-items:center;z-index:2}
.rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.rings i{position:absolute;border-radius:50%;border:1px dashed rgba(53,230,255,.22);animation:rot 40s linear infinite}
.rings i:nth-child(1){width:min(86vw,62vh,360px);height:min(86vw,62vh,360px)}
.rings i:nth-child(2){width:min(70vw,50vh,300px);height:min(70vw,50vh,300px);animation-duration:26s;animation-direction:reverse;border-style:dotted}
.rings i:nth-child(3){width:min(98vw,70vh,420px);height:min(98vw,70vh,420px);border:1px solid rgba(53,230,255,.07);animation-duration:70s}
@keyframes rot{to{transform:rotate(360deg)}}
#face{width:min(78vw,36vh,300px);aspect-ratio:4/3;height:auto;filter:drop-shadow(0 0 9px rgba(53,230,255,.5));cursor:pointer;position:relative;z-index:2}
#stat{position:absolute;bottom:2px;left:0;right:0;text-align:center;font:500 12px Orbitron,sans-serif;letter-spacing:.2em;color:var(--mu);z-index:3;text-transform:uppercase}
#heard{position:absolute;bottom:-18px;left:12px;right:12px;text-align:center;font-size:14px;color:#8fb8c8;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;font-style:italic}
#log{flex:1;min-height:0;overflow-y:auto;padding:26px 14px 10px;display:flex;flex-direction:column;gap:10px;z-index:2;-webkit-mask-image:linear-gradient(transparent 0,#000 22px);mask-image:linear-gradient(transparent 0,#000 22px);scroll-behavior:smooth}
.m{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.38;font-size:17px;word-wrap:break-word;overflow-wrap:anywhere;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.u{align-self:flex-end;background:rgba(53,230,255,.12);border:1px solid rgba(53,230,255,.3);border-bottom-right-radius:5px}
.m.j{align-self:flex-start;background:var(--gl);border:1px solid var(--bd);border-bottom-left-radius:5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.m.e{align-self:center;color:#ff9d9d;border:1px solid rgba(255,107,107,.35);background:rgba(255,107,107,.08);font-size:15px}
.m.s{align-self:center;color:var(--mu);font-size:14px;background:none;border:none;padding:2px}
.m img{max-width:100%;max-height:200px;border-radius:10px;display:block;margin-bottom:6px}
.m a{color:var(--c)}
.m code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;font-size:.9em}
.m pre{position:relative;background:#020409;border:1px solid var(--bd);border-radius:10px;padding:10px;overflow-x:auto;margin:6px 0;font-size:13px;line-height:1.35}
.m pre code{background:none;padding:0;white-space:pre}
.cp{position:absolute;top:5px;right:5px;font-size:11px;padding:2px 8px;border-radius:7px;border:1px solid var(--bd);background:#06111b;cursor:pointer}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.src a{font-size:12px;padding:2px 8px;border:1px solid var(--bd);border-radius:20px;text-decoration:none;color:var(--mu);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.typing{display:inline-flex;gap:4px}.typing b{width:6px;height:6px;border-radius:50%;background:var(--c);animation:bl 1s infinite}.typing b:nth-child(2){animation-delay:.15s}.typing b:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
.dock{z-index:6;padding:6px 12px 10px;background:linear-gradient(transparent,rgba(3,6,12,.95) 30%)}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}#chips:empty{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 6px 4px 10px;border-radius:20px;border:1px solid var(--bd);background:var(--gl);max-width:190px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip button{border:0;background:none;color:#ff8d8d;font-size:16px;line-height:1;cursor:pointer;padding:0 4px}
.chip img{width:26px;height:26px;border-radius:6px;object-fit:cover}
#f{display:flex;gap:8px;align-items:center}
#txt{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--bd);background:rgba(8,20,32,.8);padding:0 14px;outline:none;font-size:17px}
#txt:focus{border-color:rgba(53,230,255,.6);box-shadow:0 0 0 3px rgba(53,230,255,.12)}
.tools{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.tools .ib{flex:1;width:auto;height:44px}
.tools .big{flex:1.5}
#cam,#modal,#boot{position:fixed;inset:0;z-index:50;display:none}
#cam.show,#modal.show{display:flex}#boot{display:flex}
#cam{background:#000;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .bar{display:flex;gap:10px;padding:14px;justify-content:center;background:#000;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.btn{border:1px solid rgba(53,230,255,.55);background:rgba(53,230,255,.14);color:#dffaff;border-radius:14px;padding:12px 18px;cursor:pointer;font-weight:600;letter-spacing:.04em}
.btn.g{border-color:var(--bd);background:var(--gl)}
.btn:active{transform:scale(.96)}
#modal,#boot{background:rgba(2,5,10,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:14px}
.card{width:min(520px,100%);max-height:100%;overflow:auto;background:linear-gradient(160deg,rgba(14,32,48,.96),rgba(5,12,20,.97));border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h2{margin:0 0 4px;font:700 15px Orbitron,sans-serif;letter-spacing:.2em;color:var(--c)}
.card p{margin:4px 0 12px;color:var(--mu);font-size:15px;line-height:1.35}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;letter-spacing:.04em;text-transform:uppercase}
.card input[type=text],.card input[type=password],.card select,.card textarea{width:100%;height:42px;border-radius:11px;border:1px solid var(--bd);background:#06101a;padding:0 12px;outline:none}
.card input[type=range]{width:100%;accent-color:var(--c)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(120,220,255,.08)}
.sw{appearance:none;width:46px;height:26px;border-radius:20px;background:#17303d;position:relative;border:0;cursor:pointer;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#7aa;transition:.2s}
.sw:checked{background:rgba(53,230,255,.5)}.sw:checked:after{left:23px;background:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#memlist{max-height:180px;overflow:auto;margin-top:8px}
.mi{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(120,220,255,.08);font-size:14px}.mi span{flex:1}.mi button{border:0;background:none;color:#ff8d8d;font-size:18px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translate(-50%,-20px);background:rgba(8,20,32,.95);border:1px solid var(--bd);padding:8px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.logo{font:700 26px Orbitron,sans-serif;letter-spacing:.3em;color:var(--c);text-shadow:0 0 18px rgba(53,230,255,.6);text-align:center;margin:4px 0 2px}
.small{font-size:12.5px;color:#5d8494;line-height:1.35;margin-top:10px}
@media (prefers-reduced-motion:reduce){.rings i{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <i id="dot"></i><h1>J.A.R.V.I.S</h1><span class="sp"></span>
    <button class="ib" id="bMem" title="Memória" aria-label="Memória"><svg viewBox="0 0 24 24"><path d="M9 3a4 4 0 0 0-4 4v1a3 3 0 0 0-1 5 3 3 0 0 0 2 4 3.5 3.5 0 0 0 7 0V6a3 3 0 0 0-4-3z"/><path d="M15 6a3 3 0 0 1 4 2 3 3 0 0 1 1 4 3 3 0 0 1-2 4"/></svg></button>
    <button class="ib" id="bSet" title="Definições" aria-label="Definições"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l-.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <section class="stage">
    <div class="rings"><i></i><i></i><i></i></div>

    <div id="stat">A iniciar</div><div id="heard"></div>
  </section>
  <section id="log" aria-live="polite"></section>
  <footer class="dock">
    <div id="chips"></div>
    <form id="f" autocomplete="off"><input id="txt" placeholder="Escreve ou diz «Jarvis»…" enterkeyhint="send"><button class="ib act" style="width:44px;height:44px" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></form>
    <div class="tools">
      <button class="ib big act" id="bMic" title="Escuta permanente" aria-label="Microfone"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button>
      <button class="ib" id="bCam" title="Câmara" aria-label="Câmara"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <button class="ib" id="bImg" title="Imagens e ficheiros" aria-label="Anexar"><svg viewBox="0 0 24 24"><path d="m21 11-9.2 9.2a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-9.4 9.4a1.7 1.7 0 0 1-2.4-2.4L15 7"/></svg></button>
      <button class="ib" id="bVoice" title="Voz das respostas" aria-label="Voz"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
      <button class="ib" id="bStop" title="Parar" aria-label="Parar"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>

    <input type="file" id="file" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.log,.xml,.yml,.yaml,.sql,.java,.c,.cpp,.php">
  </footer>
</div>

<div id="cam"><video id="vid" playsinline muted autoplay></video><div class="bar"><button class="btn" id="camShot">Capturar e enviar</button><button class="btn g" id="camFlip">Virar</button><button class="btn g" id="camX">Fechar</button></div></div>

<div id="modal"><div class="card" id="mcard"></div></div>

<div id="boot"><div class="card">
  <div class="logo">JARVIS</div>
  <p style="text-align:center">Assistente pessoal com o cérebro do Gemini. Fica à escuta: diz <b style="color:var(--c)">«Jarvis»</b> e ele responde.</p>
  <label>Chave da API Google Gemini <span style="text-transform:none">(fica só neste telemóvel)</span></label>
  <input type="password" id="bKey" placeholder="AQ... ou AIzaSy..." autocomplete="off">
  <label>O teu nome</label>
  <input type="text" id="bName" value="Arão">
  <div class="acts" style="margin-top:18px"><button class="btn" id="bGo" style="flex:1">ATIVAR JARVIS</button></div>
  <p class="small">Ao tocar, o navegador pede o microfone. Escolhe «Permitir». Mantém o ecrã ligado e a página aberta para ele te ouvir sempre.</p>
</div></div>
<div id="toast"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({key:'',model:'gemini-1.5-flash',user:'Arão',wake:'jarvis',lang:'pt-PT',voice:'',pitch:.75,rate:1.02,search:true,listen:true,speak:true},LS.get('jv_cfg',{}));
let mem=LS.get('jv_mem',null)||{facts:[{t:'O utilizador chama-se Arão Lende, vive em Luanda (Angola) e é web designer (Arão Lende Webdesign).',ts:Date.now()}]};
let hist=LS.get('jv_hist',[]);
const saveCfg=()=>LS.set('jv_cfg',cfg),saveMem=()=>LS.set('jv_mem',mem),saveHist=()=>LS.set('jv_hist',hist.slice(-40));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const synth=window.speechSynthesis;
let started=false,busy=false,abortCtl=null,awakeUntil=0,consolidated=false;
let atts=[];

/* ---------- utilidades ---------- */
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(s){let out='';for(const p of s.split(/(```[\s\S]*?(?:```|$))/g)){if(p.startsWith('```')){const b=p.replace(/^```[^\n]*\n?/,'').replace(/```$/,'');out+='<pre><code>'+esc(b)+'</code><button class="cp" type="button">copiar</button></pre>'}else out+=esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}return out}
function speechText(s){return s.replace(/```[\s\S]*?```/g,' ').replace(/```[\s\S]*$/,' ').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/https?:\/\/\S+/g,'').replace(/[*_`#>~|]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'')}
function cleanTags(raw){return raw.replace(/<memoria>[\s\S]*?<\/memoria>/g,'').replace(/<esquecer>[\s\S]*?<\/esquecer>/g,'')}
const log=$('#log');
function addMsg(cls,html,imgs){const d=document.createElement('div');d.className='m '+cls;if(imgs)imgs.forEach(u=>{const i=document.createElement('img');i.src=u;d.appendChild(i)});const b=document.createElement('div');b.innerHTML=html;d.appendChild(b);d._b=b;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
log.addEventListener('click',e=>{if(e.target.classList.contains('cp')){const t=e.target.previousElementSibling.textContent;try{navigator.clipboard.writeText(t);e.target.textContent='copiado'}catch(_){}}});
let ac;function beep(f1=520,f2=1040,d=.14){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.05);o.connect(g).connect(ac.destination);o.start();o.stop(t+d+.06)}catch(e){}}

/* ---------- cara pixelizada ---------- */
const cv=$('#face'),cx=cv.getContext('2d');const GW=40,GH=30;
let state='idle',amp=0,pulse=0,blinkT=0,nextBlink=2500,look={x:0,y:0,tx:0,ty:0,nt:0};
const COL={idle:'#35e6ff',listen:'#5dffb8',think:'#ffc14d',speak:'#8ff3ff',sleep:'#2a7d8c'};
const LBL={idle:'Em espera · diz «Jarvis»',listen:'A ouvir…',think:'A pensar…',speak:'A falar',sleep:'Escuta desligada'};
const plate=[];(function(){const R=4;const inside=(x,y)=>{if(x<2||x>GW-3||y<1||y>GH-2)return false;const dx=Math.max(0,2+R-x,x-(GW-3-R)),dy=Math.max(0,1+R-y,y-(GH-2-R));return dx*dx+dy*dy<=R*R};for(let y=0;y<GH;y++){plate[y]=[];for(let x=0;x<GW;x++){const i=inside(x,y);plate[y][x]=i?((!inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1))?2:1):0}}})();
function setState(s){state=s;$('#stat').textContent=LBL[s]||'';}
function fit(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(8,r.width*d);cv.height=Math.max(8,r.height*d)}
addEventListener('resize',fit);
let last=0;
function draw(t){requestAnimationFrame(draw);if(document.hidden||t-last<33)return;const dt=t-last;last=t;
 const W=cv.width,H=cv.height;cx.clearRect(0,0,W,H);const cs=Math.min(W/GW,H/GH),ox=(W-cs*GW)/2,oy=(H-cs*GH)/2,g=cs*.16;
 const col=COL[state];cx.fillStyle=col;
 const cell=(x,y,a)=>{if(x<0||y<0||x>=GW||y>=GH)return;cx.globalAlpha=a;cx.fillRect(ox+x*cs+g/2,oy+y*cs+g/2,cs-g,cs-g)};
 const scan=Math.floor((t/110)%(GH+12))-6;
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const p=plate[y][x];if(!p)continue;cell(x,y,p===2?.55:.05+(Math.abs(y-scan)<1?.09:0))}
 const ph=(t/400)%1;for(let i=0;i<5;i++)cell(18+i,3,.25+.6*Math.max(0,Math.sin((ph-i*.12)*6.28)));
 blinkT+=dt;let bl=0;if(blinkT>nextBlink){bl=1;if(blinkT>nextBlink+150){blinkT=0;nextBlink=2200+Math.random()*3800}}
 look.nt-=dt;if(look.nt<=0){look.tx=Math.round(Math.random()*2-1);look.ty=Math.random()<.7?0:Math.round(Math.random()*2-1);look.nt=1200+Math.random()*2800;}
 if(state==='think'){look.tx=Math.round(Math.sin(t/380));look.ty=-1}
 look.x+=(look.tx-look.x)*.25;look.y+=(look.ty-look.y)*.25;
 let eh={idle:6,listen:7,think:5,speak:6,sleep:1}[state];if(bl&&state!=='sleep')eh=1;
 const eye=(c0)=>{const top=-(eh>>1),bot=top+eh-1;cx.fillStyle=col;for(let dy=top;dy<=bot;dy++)for(let dx=-3;dx<=3;dx++){if(eh>=3&&Math.abs(dx)===3&&(dy===top||dy===bot))continue;cell(c0+dx,11+dy,.9)}
  if(eh>=4){cx.fillStyle='#effcff';const px=Math.round(look.x),py=Math.max(-1,Math.min(1,Math.round(look.y)));for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)cell(c0+px+a,11+py+b,1)}cx.fillStyle=col};
 eye(13);eye(27);
 if(state==='think'){for(let i=-3;i<=3;i++){cell(13+i,5+(i>1?-1:0),.6);cell(27+i,5+(i>1?-1:0),.6)}}
 const speaking=ttsPending>0;
 if(speaking){const target=.3+.45*Math.abs(Math.sin(t/105))+pulse*.35;amp+=(target-amp)*.45;pulse*=.9}else amp+=(0-amp)*.3;
 cx.fillStyle=col;
 if(state==='speak'&&amp>.08){const hh=Math.min(3,Math.round(amp*3.6));for(let dy=-hh;dy<=hh;dy++){const half=Math.round(7*Math.sqrt(Math.max(0,1-(dy*dy)/((hh+.8)*(hh+.8)))));for(let dx=-half;dx<=half;dx++)cell(20+dx,22+dy,.95)}}
 else if(state==='listen'){[[0,3],[1,5],[2,3]].forEach(([r,w])=>{for(let dx=-(w>>1);dx<=(w>>1);dx++)cell(20+dx,21+r,.9)})}
 else if(state==='think'){for(let x=16;x<=24;x++)cell(x,22,.3);const d=Math.floor((t/220)%9);cell(16+d,22,1)}
 else if(state==='sleep'){for(let x=17;x<=23;x++)cell(x,22,.35)}
 else{[[13,20],[14,21],[26,21],[27,20]].forEach(([x,y])=>cell(x,y,.9));for(let x=15;x<=25;x++)cell(x,22,.9)}
 cx.globalAlpha=1}
fit();requestAnimationFrame(draw);

/* ---------- voz (síntese) ---------- */
let voices=[],ttsPending=0,streamDone=true;
function loadVoices(){voices=synth?synth.getVoices():[]}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
function pickVoice(){if(!voices.length)return null;if(cfg.voice){const v=voices.find(v=>v.name===cfg.voice);if(v)return v}
 const L=cfg.lang.toLowerCase();const pool=voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(L.slice(0,2)));
 const male=/(male|masculin|joao|joão|jo[aã]o|antonio|antónio|ricardo|felipe|daniel|cristiano|google portugu)/i;
 return pool.find(v=>male.test(v.name)&&!/female|feminin/i.test(v.name))||pool.find(v=>v.lang.toLowerCase().startsWith(L))||pool[0]||voices[0]}
function sayChunk(txt){txt=txt.trim();if(!/[\p{L}\p{N}]/u.test(txt)||!cfg.speak||!synth)return;
 const parts=[];let s=txt;while(s.length>220){let i=s.lastIndexOf(', ',200);if(i<80)i=s.lastIndexOf(' ',200);if(i<1)i=200;parts.push(s.slice(0,i+1));s=s.slice(i+1)}parts.push(s);
 for(const p of parts){const u=new SpeechSynthesisUtterance(p);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang=cfg.lang;u.pitch=cfg.pitch;u.rate=cfg.rate;
  u.onstart=()=>{if(state!=='speak')setState('speak')};u.onboundary=()=>{pulse=1};
  const done=()=>{ttsPending=Math.max(0,ttsPending-1);if(ttsPending===0)speechIdle()};u.onend=done;u.onerror=done;
  ttsPending++;updateListening();synth.speak(u)}}
function speechIdle(){if(!streamDone)return;if(!busy)setState(cfg.listen&&SR?'idle':'sleep');awakeUntil=Date.now()+22000;setTimeout(updateListening,200)}
function stopSpeaking(){try{synth&&synth.cancel()}catch(e){}ttsPending=0}
let spokenIdx=0;
function feedSpeech(full,final){const t=speechText(full);let rest=t.slice(spokenIdx);if(!rest)return;let cut=-1;if(final)cut=rest.length;else{const re=/[.!?…\n](?=\s|$)/g;let m;while((m=re.exec(rest)))cut=m.index+1;if(cut<25&&cut!==-1&&rest.length<120)cut=-1}
 if(cut>0){const chunk=rest.slice(0,cut);spokenIdx+=cut;sayChunk(chunk)}}

/* ---------- escuta ---------- */
let rec=null,recRunning=false,rt=0,lastHeard='';
function wakeRe(){const w=(cfg.wake||'jarvis').trim().toLowerCase();if(w==='jarvis')return /\b(j[aá]r?v[ie]s|jarvas|j[aá] vis|djarvis|garvis|charvis|xarvis|jarbis|jarvi)\b/i;return new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i')}
function updateListening(){clearTimeout(rt);const want=cfg.listen&&SR&&started&&!document.hidden&&ttsPending===0&&!cam.on;
 if(want&&!recRunning)startRec();else if(!want&&recRunning)stopRec();paint()}
function startRec(){if(recRunning||!SR)return;try{rec=new SR();rec.lang=cfg.lang;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
 rec.onstart=()=>{recRunning=true;if(!busy&&ttsPending===0)setState('idle');paint()};
 rec.onend=()=>{recRunning=false;paint();rt=setTimeout(updateListening,350)};
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){cfg.listen=false;saveCfg();toast('Microfone bloqueado. Permite-o nas definições do navegador.',4200);paint()}};
 rec.onresult=e=>{let it='',fin='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else it+=r[0].transcript}
  const show=(fin||it).trim();if(show)$('#heard').textContent='“'+show+'”';
  if(it&&!busy&&(wakeRe().test(it)||Date.now()<awakeUntil)&&state==='idle')setState('listen');
  if(fin.trim())onHeard(fin.trim())};
 rec.start()}catch(e){recRunning=false}}
function stopRec(){try{rec&&(rec.onend=()=>{recRunning=false;paint()},rec.abort())}catch(e){}recRunning=false}
function onHeard(t){if(t===lastHeard.t&&Date.now()-lastHeard.ts<1800)return;lastHeard={t,ts:Date.now()};
 const m=t.match(wakeRe());const awake=Date.now()<awakeUntil;if(!m&&!awake){setTimeout(()=>{if($('#heard').textContent.includes(t))$('#heard').textContent=''},2500);return}
 let cmd=t;if(m){const after=t.slice(m.index+m[0].length).replace(/^[\s,.:;!?\-–]+/,'').trim();const before=t.slice(0,m.index).replace(/[\s,.:;!?\-–]+$/,'').trim();cmd=after||before}
 cmd=cmd.trim();$('#heard').textContent='';
 if(m)beep(500,1100,.12);
 if(cmd.length<2){awakeUntil=Date.now()+25000;setState('listen');const h=new Date().getHours();respondLocal(['Sim, '+cfg.user+'?','Estou aqui, '+cfg.user+'.','Diga, '+cfg.user+'.'][Math.floor(Math.random()*3)],false);return}
 handle(cmd)}

/* ---------- comandos locais ---------- */
function respondLocal(txt){addMsg('j',md(txt));streamDone=true;spokenIdx=0;setState('speak');sayChunk(txt);if(ttsPending===0)setState('idle')}
function handle(cmd){
 if(/^(p[aá]ra|cala-?te|sil[eê]ncio|chega|stop)[\s.!]*$/i.test(cmd)){stopSpeaking();abortCtl&&abortCtl.abort();setState('idle');return}
 if(/\b(que horas|hora certa)\b/i.test(cmd)){user(cmd);const d=new Date();return respondLocal('São '+d.getHours()+' e '+String(d.getMinutes()).padStart(2,'0')+', '+cfg.user+'.')}
 if(/\b(que dia (é|e) hoje|data de hoje|em que dia estamos)\b/i.test(cmd)){user(cmd);return respondLocal('Hoje é '+new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.')}
 if(/(o que (é que )?(est[aá]s a ver|v[eê]s)|olha (para )?(isto|aqui)|tira (uma )?foto|abre a c[aâ]mara|v[eê] (isto|aqui)|d[aá] uma olhadela)/i.test(cmd)){return openCam(cmd)}
 ask(cmd)}
function user(t,imgs){addMsg('u',md(t),imgs)}

/* ---------- cérebro (Google Gemini) ---------- */
function buildSystem(){const now=new Date().toLocaleString('pt-PT',{timeZone:'Africa/Luanda',dateStyle:'full',timeStyle:'short'});
 const facts=mem.facts.map(f=>'- '+f.t).join('\n')||'(ainda nada)';
return `És o JARVIS, o assistente pessoal de IA de ${cfg.user}, inspirado no J.A.R.V.I.S. do Homem de Ferro: brilhante, leal, calmo, com humor seco e elegante. Tratas ${cfg.user} pelo nome e, de vez em quando, por "chefe". Falas português natural (de Angola/Portugal, sem brasileirismos), a menos que ele use outra língua.

Estás dentro de uma app no telemóvel dele. Ele fala-te por voz (dizendo "Jarvis") ou escreve, e TUDO o que respondes é lido em voz alta. Por isso: frases curtas e naturais, como numa conversa; normalmente 1 a 4 frases; sem listas, sem markdown e sem emojis, a não ser que ele peça texto ou código. Código vai sempre em blocos \`\`\` (esses blocos não são lidos em voz alta; diz só em palavras o que o código faz). Dá respostas longas apenas se ele pedir.

Capacidades: vês as imagens e ficheiros que ele envia e o que a câmara apanha. És especialista em programação e dás código completo e funcional.

Memória a longo prazo sobre ${cfg.user}:
${facts}

Agora são: ${now} (hora de Luanda).`}

async function ask(text){
 if(!cfg.key){openSettings('Falta a chave da API.');return}
 if(busy){toast('Um momento, ainda estou a responder.');return}
 const files=atts.slice();atts=[];renderChips();
 const parts=[];let imgs=[];let extraTxt='';
 for(const a of files){if(a.kind==='img'){parts.push({inline_data:{mime_type:'image/jpeg',data:a.data}});imgs.push(a.url)}else{extraTxt+=`\n\n[Ficheiro: ${a.name}]\n${a.text}`}
 }
 const label=text||(files.some(f=>f.kind==='img')?'O que vês nesta imagem?':'');
 parts.push({text:buildSystem()+'\n\nMensagem do utilizador: '+(label+extraTxt)});
 user(label,imgs);
 busy=true;streamDone=false;spokenIdx=0;setState('think');
 const bub=addMsg('j','<span class="typing"><b></b><b></b><b></b></span>');
 abortCtl=new AbortController();
 
 try{
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${cfg.key}`;
  const response=await fetch(url,{method:'POST',signal:abortCtl.signal,headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts}]})});
  if(!response.ok)throw new Error('Erro na API: '+response.status);
  const data=await response.json();
  const raw=(data.candidates&&data.candidates[0].content.parts[0].text)||'Sem resposta.';
  const final=cleanTags(raw).trim();
  bub._b.innerHTML=md(final);
  feedSpeech(final,true);
  hist.push({role:'user',text:label});hist.push({role:'assistant',text:final});saveHist();
 }catch(e){
  bub.remove();addMsg('e','Erro de ligação à API do Gemini.');
 }
 busy=false;streamDone=true;abortCtl=null;
 if(ttsPending===0){setState(cfg.listen&&SR?'idle':'sleep');awakeUntil=Date.now()+22000;updateListening()}
 else speechIdle();
}

/* ---------- anexos e câmara ---------- */
function renderChips(){const c=$('#chips');c.innerHTML='';atts.forEach((a,i)=>{const d=document.createElement('div');d.className='chip';if(a.url){const im=document.createElement('img');im.src=a.url;d.appendChild(im)}const s=document.createElement('span');s.textContent=a.name;d.appendChild(s);const b=document.createElement('button');b.type='button';b.textContent='×';b.onclick=()=>{atts.splice(i,1);renderChips()};d.appendChild(b);c.appendChild(d)})}
function imgToJpeg(src,max=1568){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.86);res({url:u,data:u.split(',')[1]})};im.onerror=rej;im.src=src})}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
async function addFiles(list){for(const f of list){try{if(f.type.startsWith('image/')){const u=URL.createObjectURL(f);const j=await imgToJpeg(u);atts.push({kind:'img',name:f.name||'imagem',url:j.url,data:j.data})}
 else{atts.push({kind:'txt',name:f.name,text:(await f.text()).slice(0,60000)})}}catch(e){toast('Erro ao ler ficheiro')}}renderChips()}
const cam={on:false,stream:null,facing:'environment',auto:null};
async function openCam(auto){cam.auto=auto||null;try{stopRec();cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.facing},audio:false});$('#vid').srcObject=cam.stream;$('#cam').classList.add('show');cam.on=true;if(auto)setTimeout(()=>shot(),1600)}catch(e){cam.on=false;updateListening()}}
function closeCam(){try{cam.stream&&cam.stream.getTracks().forEach(t=>t.stop())}catch(e){}$('#cam').classList.remove('show');cam.on=false;cam.auto=null;updateListening()}
async function shot(){const v=$('#vid');if(!v.videoWidth)return;const c=document.createElement('canvas');const s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext('2d').drawImage(v,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.85);atts.push({kind:'img',name:'câmara.jpg',url:u,data:u.split(',')[1]});closeCam();ask('O que estás a ver nesta imagem?')}

/* ---------- definições ---------- */
function modal(html){$('#mcard').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openSettings(msg){loadVoices();const vs=voices.filter(v=>/pt|en/i.test(v.lang)).map(v=>`<option value="${esc(v.name)}" ${v.name===cfg.voice?'selected':''}>${esc(v.name)}</option>`).join('');
 modal(`<h2>DEFINIÇÕES</h2>${msg?`<p style="color:var(--warn)">${esc(msg)}</p>`:''}
 <label>Chave da API Google Gemini</label><input type="password" id="sKey" value="${esc(cfg.key)}" autocomplete="off">
 <label>Modelo</label><input type="text" id="sModel" value="${esc(cfg.model)}">
 <label>O teu nome</label><input type="text" id="sUser" value="${esc(cfg.user)}">
 <div class="acts"><button class="btn" id="sSave">Guardar</button></div>`);
 $('#sSave').onclick=()=>{cfg.key=$('#sKey'].value.trim();cfg.model=$('#sModel'].value.trim()\vert{}\vert{}'gemini-1.5-flash';cfg.user=$('#sUser'].value.trim()||'Arão';saveCfg();closeModal();toast('Guardado.')}}

function paint(){$('#dot').classList.toggle('on',recRunning);$('#bMic').classList.toggle('off',!cfg.listen);$('#bMic').classList.toggle('act',cfg.listen);$('#bVoice').classList.toggle('off',!cfg.speak);$('#bVoice').classList.toggle('act',cfg.speak)}
$('#f').onsubmit=e=>{e.preventDefault();const t=$('#txt'].value.trim();if(!t&&!atts.length)return;$('#txt'].value='';if(!started)begin();handle(t||'')};
$('#bMic').onclick=()=>{cfg.listen=!cfg.listen;saveCfg();updateListening();paint()};
$('#bVoice').onclick=()=>{cfg.speak=!cfg.speak;saveCfg();if(!cfg.speak)stopSpeaking();paint()};
$('#bStop').onclick=()=>{stopSpeaking();abortCtl&&abortCtl.abort();setState('idle');updateListening()};
$('#face').onclick=()=>{awakeUntil=Date.now()+25000;setState('listen');beep(500,1100,.12)};
$('#bImg').onclick=()=>$('#file'].click();$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#bCam').onclick=()=>openCam(null);$('#camShot').onclick=shot;$('#camX').onclick=closeCam;$('#camFlip').onclick=async()=>{cam.facing=cam.facing==='environment'?'user':'environment';try{cam.stream&&cam.stream.getTracks().forEach(t=>t.stop());cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.facing},audio:false});$('#vid').srcObject=cam.stream}catch(e){}};
$('#bSet').onclick=()=>openSettings();

async function begin(){if(started)return;started=true;$('#boot').style.display='none';
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}catch(e){}
 const greet=`Boa noite, ${cfg.user}. Jarvis online. Em que posso ajudar?`;
 streamDone=true;addMsg('j',md(greet));sayChunk(greet);updateListening();paint()}
$('#bGo').onclick=()=>{const k=$('#bKey'].value.trim();if(k){cfg.key=k;}cfg.user=$('#bName').value.trim()||'Arão';saveCfg();if(!cfg.key){toast('Insere a chave da API.');return;}begin()};
if(cfg.key){$('#bKey').value=cfg.key;$('#bName').value=cfg.user}
setState(SR?'idle':'sleep');paint();
})();
</script>
